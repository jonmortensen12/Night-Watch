<!doctype html>
<meta charset="utf-8">
<title>wagon gallery</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; width: 100vw; height: 100vh; }</style>
<canvas id="c"></canvas>
<script type="importmap">{"imports": {"three": "/web/lib/three.module.min.js"}}</script>
<script type="module">
/* The wagon game, run right here with no host, for screenshots
   (tools/wagonshots.mjs).
   ?stage=0..5  which stage of the trail    ?lap=1   at dusk
   ?view=phone|tv   ?yaw=deg&pitch=deg   (phone: where it looks; 0 = FRONT, + = right)
   ?seat=1..3   the phone's seat           ?t=seconds  run the stage this long first
   ?put=rider,bandit,...  line some up for a portrait */
import * as THREE from 'three';
import {Trail} from '/web/trail.js';
import * as WG from '/web/wsim.js';
const q = new URLSearchParams(location.search);
const view = q.get('view') || 'phone';
const trail = new Trail(document.getElementById('c'), {mode: view === 'tv' ? 'tv' : 'phone'});
const S = WG.create(+(q.get('seed') || 4));
['Ann', 'Bob', 'Cal'].forEach((n, i) => WG.join(S, 'p' + i, n));
const me = S.players['p' + ((+(q.get('seat') || 2)) - 1)];
trail.setMe(me.color);
WG.start(S);
S.wave = (+(q.get('stage') || 0)) + 6 * (+(q.get('lap') || 0));
const DT = 1 / 60;
// skip the count, into the stage
for(let i = 0; i < 60 * 4.2; i++) WG.step(S, DT);
const put = (q.get('put') || '').split(',').filter(Boolean);
if(put.length){
  S.foes = []; S.plan.sent = 999;
  put.forEach((k, i) => {
    const x = (i - (put.length - 1) / 2) * 3.2, z = -9 - (i % 2) * 2;
    if(k === 'rider') WG.newFoe(S, 'rider', x, 0, z, {st: 'aim', station: [x, z], fireT: 99, boardT: 99, timer: 99, aux: 0.7, side: x < 0 ? -1 : 1});
    else if(k === 'bandit' || k === 'thrower') WG.newFoe(S, k, x, 0, z - 2, {st: 'up', timer: 99, aux: 0.8, side: 1});
    else if(k === 'vulture') WG.newFoe(S, 'vulture', x, 3.5, z, {st: 'dive', tgt: [x, 3.5, z], side: 1});
    else if(k === 'bat') WG.newFoe(S, 'bat', x, 2.6, z + 4, {st: 'peck', tgt: [x, 2.6, z + 4]});
    else if(k === 'cart') WG.newFoe(S, 'cart', x, 0, z, {st: 'station', station: [x, z], fireT: 99, noBoard: 1});
    else if(k === 'swinger') WG.newFoe(S, 'swinger', x, 3.5, z, {st: 'wait', side: 1, fromBalloon: 0});
    else if(k === 'balloon') WG.newFoe(S, 'balloon', x, 8, z - 14, {st: 'idle'});
    else if(k === 'dynamite') WG.newFoe(S, 'dynamite', x, 2.5, z + 3, {st: 'idle'});
    else if(k === 'crate') WG.newFoe(S, 'crate', x, 0, z, {st: 'idle'});
    else if(k === 'tumble') WG.newFoe(S, 'tumble', x, 0, z, {st: 'idle'});
  });
  S.foes.forEach(f => { f.face = Math.atan2(-f.x, -f.z); });
}
const freeze = put.length > 0;
let simT = +(q.get('t') || 0);
for(let i = 0; i < simT * 60; i++){ WG.step(S, DT); S.hp = 100; S.ev = []; }
const yaw = (+(q.get('yaw') || 0)) * Math.PI / 180, pitch = (+(q.get('pitch') || 0)) * Math.PI / 180;
const eul = new THREE.Euler(pitch, -yaw, 0, 'YXZ'), qq = new THREE.Quaternion().setFromEuler(eul);
let acc = 0, last = performance.now();
function frame(){
  requestAnimationFrame(frame);
  const now = performance.now(); acc += Math.min(0.1, (now - last) / 1000); last = now;
  while(acc > 0.05){
    acc -= 0.05;
    if(!freeze) for(let i = 0; i < 3; i++){ WG.step(S, DT); S.hp = Math.max(S.hp, 60); }
    const s = WG.snap(S);
    if(freeze) s.ev = [];
    trail.feed(s);
  }
  if(view !== 'tv') trail.setView(qq, me.x, me.z, WG.EYE);
  trail.render();
}
frame();
window.ready = true;
window.TRAIL = trail; window.SIM = S;
</script>
