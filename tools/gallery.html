<!doctype html>
<meta charset="utf-8">
<title>gallery</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; width: 100vw; height: 100vh; }</style>
<canvas id="c"></canvas>
<script type="importmap">{"imports": {"three": "/web/lib/three.module.min.js"}}</script>
<script type="module">
/* The Bunker's monsters lined up for a portrait, in either look
   (tools/lookshots.mjs). ?look=gameday|halloween&set=ground|air|shots */
import * as THREE from 'three';
import {Yard} from '/web/yard.js';
import {MONSTER_LIST} from '/web/zsim.js';
const q = new URLSearchParams(location.search);
const yard = new Yard(document.getElementById('c'), {mode: 'phone'});
yard.setLook(q.get('look') || 'gameday');
yard.setWeapon(0);
const set = q.get('set') || 'ground';
// a snapshot: [id, type, x, y, z, face*100, hp%, st, sec, vx, vz] per monster
const row = [];
const put = (id, type, x, y, z, face) => row.push(id, MONSTER_LIST.indexOf(type), x, y, z, Math.round(face * 100), 100, 0, 0, 0, 0);
let eye = [0, 1.55, 2.5], lookAt = [0, 1.2, -4];
if(set === 'ground'){
  put(1, 'pumpkin', -2.6, 0, -6, 0.35); put(2, 'skeleton', -0.9, 0, -5.5, 0.15); put(3, 'brute', 1.0, 0, -7, -0.1); put(4, 'ghost', 2.9, 0.6, -5.8, -0.4);
} else if(set === 'air'){
  eye = [0, 1.6, 3.2]; lookAt = [0, 2.2, -3];
  put(1, 'witch', 0, 2.6, -3, 0.5); put(2, 'bat', -2.4, 2.2, -4, 0.9); put(3, 'bat', -1.8, 3.2, -5, 1.2); put(4, 'bomb', 2.3, 1.6, -3, 0);
} else if(set === 'minis'){
  // what the guns fire, held still for a portrait
  const {buildMini} = await import('/web/gameday.js');
  const a = buildMini('player'), b = buildMini('cosmo'), c = buildMini('player');
  // stood up: the flying pose, upright, is a touchdown
  for(const [m, x, ry] of [[a, -0.45, 0.4], [b, 0.0, 0], [c, 0.45, -0.4]]){
    m.rotation.set(Math.PI / 2, 0, 0);
    const h = new THREE.Group(); h.add(m); h.position.set(x, 1.05, 1.2); h.rotation.y = ry; yard.scene.add(h);
  }
  eye = [0, 1.35, 2.35]; lookAt = [0, 1.25, 1.2];
}
yard.feed({t: 's', ph: 'wave', pl: [], m: row, ev: []});
const eul = new THREE.Euler(), qq = new THREE.Quaternion();
function frame(){
  requestAnimationFrame(frame);
  const d = [lookAt[0] - eye[0], lookAt[1] - eye[1], lookAt[2] - eye[2]], l = Math.hypot(...d);
  eul.set(Math.asin(d[1] / l), Math.atan2(-d[0], -d[2]), 0, 'YXZ');
  qq.setFromEuler(eul);
  yard.setView(qq, eye[0], eye[2], eye[1]);
  // the shots set: a volley of minis in flight
  if(set === 'shots' && Math.floor(performance.now() / 700) !== frame.k){
    frame.k = Math.floor(performance.now() / 700);
    const from = new THREE.Vector3(0.2, 1.4, 1.6);
    yard.launchMini(from, new THREE.Vector3(-1.5, 1.3, -14), 0);
    for(let i = 0; i < 5; i++) yard.launchMini(from, new THREE.Vector3(-2 + i, 1 + Math.random(), -9), 1);
    yard.launchMini(from, new THREE.Vector3(1.8, 1.6, -18), 2);
  }
  yard.render();
}
frame();
window.ready = true;
window.YARD = yard;
</script>
